<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Booking Details · Kaushalya Admin</title><link rel="stylesheet" href="admin.css"></head><body data-page="booking"><aside class="sidebar" data-sidebar></aside><div class="overlay" data-overlay></div><div class="app"><header class="topbar"><div class="topbar-actions"><button class="icon-btn menu-btn" data-menu aria-label="Open menu">☰</button><span class="topbar-title">Hotel Administration</span></div><div class="topbar-actions"><button class="icon-btn" data-theme aria-label="Toggle dark mode">◐</button><span class="admin-badge">A</span></div></header><main class="content"><div class="page-head"><div><a class="id-link" href="bookings.html">← Back to bookings</a><h1 data-booking-title style="margin-top:10px">Booking details</h1><p>Reservation and room assignment information.</p></div><div class="booking-actions"><button class="btn btn-secondary" type="button" onclick="window.print()" aria-label="Print booking summary">Print Summary</button></div></div><div class="notice" data-error hidden role="alert"></div><div class="notice success" data-success hidden role="status"></div><div class="detail-layout"><div class="booking-main"><section class="card"><div class="card-head"><h2>Reservation information</h2></div><dl class="fields" data-fields><div class="booking-skeleton skeleton-block" aria-label="Loading booking"></div></dl></section><section class="card assignment-card" data-assignment-section aria-busy="true"><div class="card-head"><h2>Room Assignment</h2><div data-assignment-actions></div></div><div data-assignment-content><div class="assignment-skeleton"><span></span><span></span><span></span></div></div><div class="assignment-error" data-assignment-error hidden role="alert"><p>Room assignment could not be loaded.</p><button class="btn btn-secondary btn-small" type="button" data-assignment-retry>Retry</button></div></section></div><aside class="card sticky-card"><div class="card-head"><h2>Update status</h2></div><form data-status-form><label class="form-label" for="bookingStatus">Booking status</label><select class="select" id="bookingStatus" data-status-select><option>Pending</option><option>Confirmed</option><option>Cancelled</option><option>Completed</option></select><button class="btn" type="submit">Save status</button></form><p class="muted">Only the booking status can be changed from this page.</p></aside></div></main></div><dialog class="room-modal" data-room-modal aria-labelledby="room-modal-title"><div class="modal-head"><div><p class="eyebrow">Room Assignment</p><h2 id="room-modal-title">Assign a room</h2><p class="muted" data-room-modal-description></p></div><button class="icon-btn" type="button" data-close-room-modal aria-label="Close room selection">×</button></div><div class="room-modal-body"><div class="notice" data-room-error hidden role="alert"></div><div class="room-grid" data-room-list></div></div></dialog><script src="../api-config.js"></script><script src="auth.js"></script><script src="sidebar.js"></script><script src="admin.js"></script></body></html>
