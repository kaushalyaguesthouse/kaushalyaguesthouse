<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bookings · Kaushalya Admin</title><link rel="stylesheet" href="admin.css"></head>
<body data-page="bookings"><aside class="sidebar" data-sidebar></aside><div class="overlay" data-overlay></div><div class="app"><header class="topbar"><div class="topbar-actions"><button class="icon-btn menu-btn" data-menu aria-label="Open menu">☰</button><span class="topbar-title">Hotel Administration</span></div><div class="topbar-actions"><button class="icon-btn" data-theme aria-label="Toggle dark mode">◐</button><span class="admin-badge">A</span></div></header><main class="content">
  <div class="page-head"><div><p class="eyebrow">Reservations</p><h1>Bookings</h1><p>Review and manage reservation records.</p></div><span class="label" data-total aria-live="polite">Loading…</span></div>
  <div class="notice" data-error hidden role="alert"></div>
  <form class="booking-filters" data-booking-filters>
    <label class="filter-search"><span>Search</span><input class="input" type="search" name="search" placeholder="Booking ID, guest, phone or email"></label>
    <label><span>Status</span><select class="select" name="status"><option value="">All statuses</option><option value="Pending">Pending</option><option value="Confirmed">Confirmed</option><option value="Cancelled">Cancelled</option><option value="Completed">Completed</option></select></label>
    <label><span>Room type</span><select class="select" name="room_type"><option value="">All room types</option><option value="AC Room">AC Room</option><option value="Non AC Room">Non AC Room</option></select></label>
    <label><span>Check-in from</span><input class="input" type="date" name="check_in_from"></label><label><span>Check-in to</span><input class="input" type="date" name="check_in_to"></label>
    <div class="filter-actions"><button class="btn" type="submit" data-apply-filters>Apply filters</button><button class="btn btn-secondary" type="button" data-clear-filters>Clear filters</button></div>
  </form>
  <section class="table-card" data-bookings-section aria-live="polite" aria-busy="true"><div class="table-scroll"><table><thead><tr><th>Booking ID</th><th>Customer</th><th>Phone</th><th>Email</th><th>Room</th><th>Check In</th><th>Check Out</th><th>Guests</th><th>Payment Type</th><th>Payment Status</th><th>Booking Status</th><th>Amount</th><th>Advance</th><th>Created At</th></tr></thead><tbody data-bookings><tr><td colspan="14" class="empty">Loading bookings…</td></tr></tbody></table></div><div class="pagination"><button class="btn btn-secondary" type="button" data-previous-page disabled>Previous</button><span data-page-indicator>Page 1</span><button class="btn btn-secondary" type="button" data-next-page disabled>Next</button></div></section>
</main></div><script src="../api-config.js"></script><script src="auth.js"></script><script src="sidebar.js"></script><script src="admin.js"></script></body></html>
