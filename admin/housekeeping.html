<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Housekeeping · Kaushalya Admin</title><link rel="stylesheet" href="admin.css"></head>
<body data-page="housekeeping"><aside class="sidebar" data-sidebar></aside><div class="overlay" data-overlay></div><div class="app"><header class="topbar"><div class="topbar-actions"><button class="icon-btn menu-btn" data-menu aria-label="Open menu">☰</button><span class="topbar-title">Hotel Administration</span></div><div class="topbar-actions"><button class="icon-btn" data-theme aria-label="Toggle dark mode">◐</button><span class="admin-badge">A</span></div></header>
<main class="content"><div class="page-head"><div><p class="eyebrow">Operations</p><h1>Housekeeping</h1><p>Track cleaning tasks and prepare rooms for arriving guests.</p></div></div>
<div class="notice success housekeeping-toast" data-housekeeping-success hidden role="status" aria-live="polite"></div>
<form class="housekeeping-toolbar" data-housekeeping-filters role="search"><label><span>Status</span><select class="select" name="status" data-housekeeping-status><option value="">All</option><option>Pending</option><option>Cleaning</option><option>Completed</option><option>Inspected</option></select></label><label class="housekeeping-search"><span>Room search</span><input class="input" type="search" name="room_number" data-housekeeping-room placeholder="Room number" autocomplete="off"></label><button class="btn" type="submit">Apply filters</button><button class="btn btn-secondary" type="button" data-housekeeping-refresh aria-label="Refresh housekeeping tasks">↻ Refresh</button></form>
<section class="table-card housekeeping-results" data-housekeeping-section aria-live="polite" aria-busy="true"><div class="housekeeping-error" data-housekeeping-error hidden role="alert"><strong>Housekeeping tasks could not be loaded.</strong><p>Please check your connection and try again.</p><button class="btn btn-small" type="button" data-housekeeping-retry>Retry</button></div><div class="table-scroll housekeeping-table"><table><thead><tr><th>Room Number</th><th>Task Type</th><th>Current Status</th><th>Created</th><th>Completed</th><th>Actions</th></tr></thead><tbody data-housekeeping-rows></tbody></table></div><div class="housekeeping-cards" data-housekeeping-cards></div><div class="pagination"><button class="btn btn-secondary" type="button" data-housekeeping-previous>Previous</button><strong data-housekeeping-page>Page 1</strong><button class="btn btn-secondary" type="button" data-housekeeping-next>Next</button></div></section>
</main></div><script src="../api-config.js"></script><script src="auth.js"></script><script src="sidebar.js"></script><script src="admin.js"></script></body></html>
