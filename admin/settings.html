<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business Settings · Kaushalya Admin</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="business.css"></head><body data-page="settings"><aside class="sidebar" data-sidebar></aside><div class="overlay" data-overlay></div><div class="app"><header class="topbar"><div class="topbar-actions"><button class="icon-btn menu-btn" data-menu aria-label="Open menu">☰</button><span class="topbar-title">Hotel Administration</span></div><div class="topbar-actions"><button class="icon-btn" data-theme aria-label="Toggle dark mode">◐</button><span class="admin-badge">A</span></div></header><main class="content business-page"><div class="page-head"><div><p class="eyebrow">Business &amp; reporting</p><h1>Business Settings</h1><p>Manage business identity and invoice preferences.</p></div></div><div class="business-loading" data-loading role="status">Loading business settings…</div><div class="business-error card" data-load-error hidden role="alert"><strong>Settings could not be loaded.</strong><button class="btn" data-retry>Retry</button></div><form class="settings-form card" data-settings-form hidden><div class="settings-grid"><label><span>Business Name</span><input class="input" name="business_name" required></label><label><span>GST Number</span><input class="input" name="gst_number"></label><label><span>GST %</span><input class="input" name="gst_percent" type="number" min="0" max="100" step="0.01"></label><label><span>Phone</span><input class="input" name="phone" type="tel"></label><label><span>Email</span><input class="input" name="email" type="email"></label><label><span>Invoice Prefix</span><input class="input" name="invoice_prefix" maxlength="12"></label><label><span>Timezone</span><select class="select" name="timezone"><option>Asia/Kolkata</option><option>UTC</option></select></label><label><span>Currency</span><select class="select" name="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label><label class="wide"><span>Address</span><textarea class="input" name="address" rows="3"></textarea></label><label class="wide"><span>Logo Upload <small>(when supported)</small></span><input class="input" name="logo" type="file" accept="image/png,image/jpeg,image/webp"><small data-logo-support>Logo metadata support is detected automatically.</small></label><label class="wide"><span>Invoice Footer</span><textarea class="input" name="invoice_footer" rows="4"></textarea></label></div><button class="btn" type="submit">Save Settings</button></form><div class="toast" data-success hidden role="status">Business settings saved.</div></main></div><script src="auth.js"></script><script src="sidebar.js"></script><script src="business.js"></script></body></html>
